timezone: Europe/Moscow

# delivery:
#   batches  — каждый час сбор новостей и отправка пачкой по batch_size в течение publish_window:
#              пока в очереди меньше минимума, новости копятся; последний запуск дня отправляет всё
#   realtime — каждая новость через send_delay_minutes после публикации (только локальный запуск)
#   digest   — раз в день одной подборкой в digest_time (только локальный запуск)
# На Vercel часовые запуски задаются в vercel.json (время там в UTC): при изменении
# publish_window поправь и его.
delivery: batches
publish_window: "09:00-22:00"
batch_size: "5-10"
send_delay_minutes: 5
digest_time: "09:00"
collect_interval_minutes: 2    # realtime/digest: как часто обходить сайты

max_age_hours: 26              # новости старше этого (по дате из RSS) не присылаются
lead_max_chars: 600            # длина пересказа под заголовком
link_preview: false
translate_to: ru               # язык перевода; провайдер задаётся в .env (TRANSLATOR)

# Фильтр по теме для источников с `filter: true`.
# Новость проходит, если ключевое слово есть в заголовке или встречается в тексте
# не меньше topic_min_text_hits раз. `*` в конце — любое окончание.
# Слова целиком ЗАГЛАВНЫМИ (AI, ML, MCP) учитывают регистр, остальные — нет.
topic_min_text_hits: 2
