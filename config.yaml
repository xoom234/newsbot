# type:
#   auto — сначала пробует url как RSS, потом ищет ссылку на RSS на странице,
#          потом использует link_selector (default)
#   rss  — url указывает прямо на RSS/Atom
#   html — только link_selector: CSS-селектор ссылок на статьи на странице-ленте
# fetch_article: false — брать текст из описания в RSS, а не со страницы статьи
#
# При первом обходе нового источника бот только запоминает уже опубликованное,
# присылать начинает то, что вышло после этого.
sources:
  - name: OpenAI Developers
    url: https://developers.openai.com/rss.xml
    type: rss
    emoji: "🟢"

  - name: Claude Platform Release Notes
    url: https://platform.claude.com/docs/en/release-notes/feed.xml
    type: rss
    emoji: "🟠"
    fetch_article: false

  - name: Anthropic Engineering
    url: https://www.anthropic.com/engineering
